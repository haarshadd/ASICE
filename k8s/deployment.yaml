apiVersion: apps/v1
kind: Deployment
metadata:
  name: asice
  labels:
    app: asice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: asice
  template:
    metadata:
      labels:
        app: asice
    spec:
      containers:
        - name: asice
          image: haarshadd/asice:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8501
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
