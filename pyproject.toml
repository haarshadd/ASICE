[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "asice"
version = "0.1.0"
description = "Adaptive Spatial Image Compression Engine: ROI-aware dataset compression for low-storage ML developers"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "onnxruntime>=1.16",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
asice = "asice.cli:main"

[tool.setuptools.packages.find]
include = ["asice*"]

[tool.setuptools.package-data]
asice = ["models/*.onnx", "models/*.onnx.data", "models/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]